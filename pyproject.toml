[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "procureflow"
version = "0.1.0"
description = "Local-first multi-agent procurement with durable human approvals"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=1.2.15,<2", "langgraph-checkpoint-sqlite>=3.1.2,<4",
  "langchain-ollama>=1.1,<2", "mcp>=1.30,<2",
  "fastapi>=0.143,<1", "uvicorn>=0.54,<1", "httpx>=0.28,<1"
]
[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.14,<1"]
[project.scripts]
procureflow = "procureflow.cli:main"
[tool.setuptools.package-data]
procureflow = ["static/*", "data/*.json"]
[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["procureflow*"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

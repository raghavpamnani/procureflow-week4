services:
  app:
    build: .
    ports:
      - "127.0.0.1:8040:8040"
    environment:
      PROCUREFLOW_MODE: ${PROCUREFLOW_MODE:-demo}
      PROCUREFLOW_MODEL: ${PROCUREFLOW_MODEL:-qwen3:1.7b}
      OLLAMA_HOST: ${OLLAMA_HOST:-http://ollama:11434}
    volumes:
      - procureflow-data:/data
    restart: unless-stopped
  ollama:
    image: ollama/ollama:0.40.5
    profiles: [local-model]
    environment:
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_NUM_PARALLEL: "1"
    volumes:
      - model-data:/root/.ollama
    restart: unless-stopped
volumes:
  procureflow-data:
  model-data:
